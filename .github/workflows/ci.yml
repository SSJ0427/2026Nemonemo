# PR 과 main push 마다 자동으로 도는 빠른 검사 (몇 분 안에 끝남)
#  - python : pytest (Python 레퍼런스 구현 + 골든 데이터)
#  - flutter: flutter analyze (Dart 문법·린트. OpenCV 를 빌드하지 않아 빠름)
# OpenCV 를 컴파일해야 하는 flutter test 는 오래 걸려서 dart-test.yml 에서 수동 실행한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      # 서버에는 화면이 없어서 GUI 없는 opencv 를 쓴다 (테스트에 필요한 것만 설치)
      - run: pip install opencv-python-headless numpy pytest
      - run: pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
